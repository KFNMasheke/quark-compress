name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -c "from quarkcompress.qcore import BACKEND; assert BACKEND == 'native', BACKEND"
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        env:
          QUARK_PURE_PYTHON: '1'
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e . "setuptools>=77"
      - run: python tools/sanitize.py
