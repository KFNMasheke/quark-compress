[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quark-compress"
version = "0.4.0"
description = "Evidence-first lossless compression research lab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaziwale Masheke"}]
requires-python = ">=3.11"
dependencies = ["zstandard==0.25.0"]

[project.urls]
Repository = "https://github.com/KFNMasheke/quark-compress"
Issues = "https://github.com/KFNMasheke/quark-compress/issues"
Roadmap = "https://github.com/KFNMasheke/quark-compress/blob/main/docs/ROADMAP.md"

[tool.setuptools.packages.find]
include = ["quarkcompress*"]
